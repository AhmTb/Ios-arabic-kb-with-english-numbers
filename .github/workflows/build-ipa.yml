name: Build unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile app and keyboard for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Arabic123.xcodeproj \
            -scheme Arabic123 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            2>&1 | tee build.log
      - name: Validate binaries and package unsigned IPA
        run: python3 scripts/package_ipa.py
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Arabic123-unsigned-IPA
          path: dist/Arabic123-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
