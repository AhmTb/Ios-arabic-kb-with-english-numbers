name: Build unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile app and keyboard for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Arabic123.xcodeproj \
            -scheme Arabic123 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            2>&1 | tee build.log
      - name: Validate binaries and package unsigned IPA
        uses: actions/github-script@v7
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const result = spawnSync('python3', ['scripts/package_ipa.py'], {encoding: 'utf8'});
            process.stdout.write(result.stdout || '');
            process.stderr.write(result.stderr || '');
            const ok = result.status === 0;
            const details = (result.stderr || result.error?.message || 'Packaging failed').trim().split('\n').slice(-1)[0];
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: ok ? 'success' : 'failure', context: 'IPA packaging',
              description: (ok ? 'Validated arm64 app and keyboard; unsigned IPA packaged' : details).slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!ok) core.setFailed(details);
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Arabic123-unsigned-IPA
          path: dist/Arabic123-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
